name: MayaOS CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      build_iso:
        description: "Run full live-build ISO job"
        type: boolean
        default: true

concurrency:
  group: mayaos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh scripts/lib/*.sh \
            config/auto/config config/auto/clean \
            config/hooks/live/*.hook.chroot \
            config/hooks/normal/*.hook.chroot \
            config/includes.chroot/usr/local/bin/* || true

      - name: Run validate.sh
        run: ./scripts/validate.sh

      - name: Run check-deps (non-strict)
        run: ./scripts/check-deps.sh --no-hint || true

      - name: Run Chromebook check (informational)
        run: ./scripts/check-chromebook.sh

  build-iso:
    name: Build live ISO
    needs: validate
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.build_iso == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Build ISO in Debian 13 (Trixie)
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            debian:trixie bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y \
                live-build debootstrap squashfs-tools xorriso \
                isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin \
                mtools dosfstools ca-certificates curl rsync
              lb --version
              chmod +x scripts/*.sh scripts/lib/*.sh config/auto/config config/auto/clean
              ./scripts/build-iso.sh --skip-deps-check
            '

      - name: QEMU verified guest boot test
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-system-x86
          ISO="$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO" || { echo "No ISO artifact found"; exit 1; }
          echo "Starting headless QEMU boot smoke test for $ISO"
          sudo chown -R "$(id -u):$(id -g)" out
          test -w out || { echo "ISO output directory is not writable"; exit 1; }
          python3 scripts/ci-qemu-monitor.py > out/qemu-monitor.log 2>&1 &
          MONITOR_PID=$!
          set +e
          timeout --signal=TERM --kill-after=10s 180s \
            qemu-system-x86_64 \
              -machine accel=tcg -m 2048 -smp 2 \
              -cdrom "$ISO" -boot d \
              -display none -vga std -serial file:out/qemu-serial.log \
              -monitor unix:out/qemu-monitor.sock,server=on,wait=off -no-reboot \
              -nic none
          RC=$?
          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true
          set -e
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 124 ]; then
            echo "QEMU terminated unexpectedly with exit $RC"
            exit "$RC"
          fi
          if ! grep -q "MAYAOS_BOOT_OK" out/qemu-serial.log; then
            echo "MayaOS guest did not emit its systemd boot marker."
            tail -n 100 out/qemu-serial.log || true
            exit 1
          fi
          echo "Verified MayaOS reached the multi-user systemd boot milestone."
          echo "Graphical desktop readiness is not yet verified."

      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mayaos-iso
          path: |
            out/*.iso
            out/*.sha256
            out/build-*.log
            out/qemu-serial.log
            out/qemu-monitor.log
            out/qemu-boot-*.ppm
          if-no-files-found: warn
          retention-days: 14

      - name: Reminder
        if: success()
        run: |
          echo "Artifact uploaded as a *candidate* ISO."
          echo "Bootability is not certified by CI until QEMU/hardware testing."
