name: MayaOS CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      build_iso:
        description: "Run full live-build ISO job"
        type: boolean
        default: true

concurrency:
  group: mayaos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh scripts/lib/*.sh \
            config/auto/config config/auto/clean \
            config/hooks/live/*.hook.chroot \
            config/hooks/normal/*.hook.chroot \
            config/includes.chroot/usr/local/bin/* || true

      - name: Run validate.sh
        run: ./scripts/validate.sh

      - name: Run check-deps (non-strict)
        run: ./scripts/check-deps.sh --no-hint || true

      - name: Run Chromebook check (informational)
        run: ./scripts/check-chromebook.sh

  build-iso:
    name: Build live ISO
    needs: validate
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.build_iso == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Build ISO in Debian 13 (Trixie)
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            debian:trixie bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y \
                live-build debootstrap squashfs-tools xorriso \
                isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin \
                mtools dosfstools ca-certificates curl rsync
              lb --version
              chmod +x scripts/*.sh scripts/lib/*.sh config/auto/config config/auto/clean
              ./scripts/build-iso.sh --skip-deps-check
            '

      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mayaos-iso
          path: |
            out/*.iso
            out/*.sha256
            out/build-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Reminder
        if: success()
        run: |
          echo "Artifact uploaded as a *candidate* ISO."
          echo "Bootability is not certified by CI until QEMU/hardware testing."
