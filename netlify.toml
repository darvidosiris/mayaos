[build]
  publish = "browser-portal"
  command = ""

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-src 'self' https:; img-src 'self' data:; base-uri 'none'; form-action 'none'"
